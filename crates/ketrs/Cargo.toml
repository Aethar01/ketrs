[package]
name = "ketrs"
description = "Quantum computer simulator: statevectors, density matrices, MPS and Vulkan GPU, with OpenQASM 3"
readme = "../../README.md"
keywords = ["quantum", "simulation", "statevector", "physics"]
categories = ["science", "simulation"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ash = { version = "0.38.0", optional = true }
faer = "0.24.4"
num-complex = "0.4"
rand = { version = "0.9", default-features = false }
rayon = "1.12.0"

[dev-dependencies]
criterion = "0.7.0"
proptest = "1"
rand = "0.9"

[lints]
workspace = true

[[bench]]
name = "statevector"
harness = false

[features]
default = []
# GPU statevectors through Vulkan compute (opt-in). Building needs glslc
# (see build.rs); running needs only a Vulkan driver, loaded dynamically.
gpu = ["dep:ash"]
