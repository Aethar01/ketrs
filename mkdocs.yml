site_name: ketrs
site_description: A fast quantum computer simulator in Rust, with Python bindings, Vulkan GPU acceleration, and Qiskit / OpenQASM 3 support.
site_url: https://aethar01.github.io/ketrs/
repo_url: https://github.com/Aethar01/ketrs
repo_name: Aethar01/ketrs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_section_style: list

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/install.md
      - Quick Start: getting-started/quickstart.md
      - Choosing an Engine: getting-started/engines.md
  - Guides:
      - Circuits, Parameters & Optimization: guides/circuits.md
      - GPU Acceleration (Vulkan): guides/gpu.md
      - Hamiltonians, Evolution & VQE: guides/hamiltonians.md
      - Noise & Dynamic Circuits: guides/noise-and-control-flow.md
      - Matrix Product States & Symmetries: guides/mps.md
      - Qiskit & OpenQASM 3: guides/qiskit-and-qasm.md
  - Examples:
      - Lattice Schwinger Model: examples/schwinger.md
  - Benchmarks: benchmarks.md
  - API Reference:
      - api/index.md
      - Circuits & Observables: api/circuits.md
      - Statevectors & GPU: api/statevectors.md
      - Noise & Density Matrices: api/noise.md
      - Matrix Product States: api/mps.md
      - Qiskit Interop: api/qiskit.md
      - Rust API (docs.rs): https://docs.rs/ketrs
