[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ketrs"
description = "Quantum computer simulation backend written in Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "Elliott Ashby" }]
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest", "qiskit>=1.0", "qiskit-aer"]

[tool.maturin]
manifest-path = "crates/ketrs-py/Cargo.toml"
python-source = "python"
module-name = "ketrs._ketrs"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
