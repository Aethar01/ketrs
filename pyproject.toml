[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ketrs"
description = "Quantum computer simulation backend written in Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "Elliott Ashby" }]
dependencies = ["numpy>=1.24"]
dynamic = ["version"]
keywords = ["quantum", "simulator", "statevector", "mps", "qiskit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/Aethar01/ketrs"
Changelog = "https://github.com/Aethar01/ketrs/blob/main/CHANGELOG.md"

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
aer = ["qiskit>=1.0", "qiskit-aer"]

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest", "qiskit>=1.0", "qiskit-aer", "qiskit-qasm3-import", "scipy"]

[tool.maturin]
manifest-path = "crates/ketrs-py/Cargo.toml"
python-source = "python"
module-name = "ketrs._ketrs"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
