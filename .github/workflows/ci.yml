name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y glslc
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # The portable kernels, which CPUs without AVX2 and FMA use.
      - run: cargo test -p ketrs --test properties --test statevector
        env:
          KETRS_NO_SIMD: "1"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y glslc
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13
      - run: uv pip install maturin pytest qiskit qiskit-aer qiskit-qasm3-import numpy scipy
      - run: uv run --no-project maturin develop --release --features gpu
      - run: uv run --no-project pytest
